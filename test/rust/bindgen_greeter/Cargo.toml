[package]
name = "bindgen_greeter"
edition = "2021"

[[bin]]
name = "bindgen_greeter"
path = "src/main.rs"

[dependencies]
# 0.2.128 is the first release whose emscripten glue does not need an aggregate
# `wasmExports` object (wasm-bindgen/wasm-bindgen#5270); must match the wasm-bindgen-cli
# version exactly.
wasm-bindgen = "=0.2.128"
