# Example Meson cross file for Emscripten (wasm64)
# Usage: meson setup builddir --cross-file tools/meson/wasm64-emscripten.ini

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
exe_wrapper = 'node'

[built-in options]
c_args = ['-m64']
c_link_args = ['-m64']
cpp_args = ['-m64']
cpp_link_args = ['-m64']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm64'
cpu = 'wasm64'
endian = 'little'
