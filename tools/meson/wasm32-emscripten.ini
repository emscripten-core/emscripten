# Example Meson cross file for Emscripten (wasm32)
# Usage: meson setup builddir --cross-file tools/meson/wasm32-emscripten.ini

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
exe_wrapper = 'node'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
