# Configuration for Gemini Code Assist on GitHub.
# See https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns:
  - "test/third_party/**"
  - "third_party/**"
