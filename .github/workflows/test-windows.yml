name: test-windows

on:
  create:
    tags:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: 'path with spaces ()'
    env:
      PYTHONUNBUFFERED: "1"
      EMSDK_NOTTY: "1"
      EMTEST_LACKS_NATIVE_CLANG: "1"
      EMTEST_SKIP_V8: "1"
      EMTEST_SKIP_SCONS: "1"
      EMTEST_SKIP_RUST: "1"
      EMTEST_SKIP_NODE_25: "1"
      EMTEST_SKIP_PKG_CONFIG: "1"
      EMTEST_SKIP_MESON: "1"
      EMTEST_BROWSER: "0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2
        with:
          path: 'path with spaces ()'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build launcher
        run: |
          cd tools\pylauncher
          call build.bat
        shell: cmd

      - name: Install cmake and ninja
        run: |
          python -m pip install cmake ninja
          cmake --version
          ninja --version

      - name: Read emsdk version
        id: emsdk_version
        run: echo "version=$((Get-Content test/emsdk_version.txt).Trim())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install Emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk_version.outputs.version }}
          emsdk-version: main

      - name: Set EM_CONFIG
        run: echo "EM_CONFIG=$env:EMSDK\.emscripten" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Pip install
        run: '& $env:EMSDK_PYTHON -m pip install -r requirements-dev.txt'

      - name: Bootstrap
        run: '& $env:EMSDK_PYTHON bootstrap.py'

      - name: Crossplatform tests
        run: .\test\runner.exe --crossplatform-only

      - name: Sockets tests
        run: .\test\runner.exe 'sockets_node.test_nodejs_sockets_echo*'

      - name: Sanity tests
        run: .\test\runner.exe sanity.test_windows_path_casing

      - name: Check clean
        run: |
          git checkout tools/pylauncher
          & $env:EMSDK_PYTHON test/check_clean.py

  test-windows-browser-firefox:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: 'path with spaces ()'
    env:
      PYTHONUNBUFFERED: "1"
      EMSDK_NOTTY: "1"
      GALLIUM_DRIVER: "softpipe"
      EMTEST_LACKS_GRAPHICS_HARDWARE: "1"
      EMTEST_LACKS_SOUND_HARDWARE: "1"
      EMTEST_LACKS_WEBGPU: "1"
      EMTEST_DETECT_TEMPFILE_LEAKS: "0"
      EMTEST_HEADLESS: "1"
      EMTEST_CORES: "2"
      DISPLAY: ":0"
      EM_FROZEN_CACHE: ""

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2
        with:
          path: 'path with spaces ()'

      - name: Install cmake and ninja
        run: |
          python -m pip install cmake ninja
          cmake --version
          ninja --version

      - name: Read emsdk version
        id: emsdk_version
        run: echo "version=$((Get-Content test/emsdk_version.txt).Trim())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install Emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk_version.outputs.version }}
          emsdk-version: main

      - name: Set EM_CONFIG and PATH
        run: |
          echo "EM_CONFIG=$env:EMSDK\.emscripten" >> $env:GITHUB_ENV
          echo "$(Split-Path $env:EMSDK_NODE -Parent)" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Pip install
        run: '& $env:EMSDK_PYTHON -m pip install -r requirements-dev.txt'

      - name: Bootstrap
        run: '& $env:EMSDK_PYTHON bootstrap.py'

      - name: Install Firefox Nightly
        run: |
          cd "$HOME"
          npx --yes @puppeteer/browsers install firefox@nightly '--format={{path}}' | tee browser_path.txt
          BROWSER_PATH=$(tail -n 1 browser_path.txt | tr -d '\r')
          if [[ -z "${BROWSER_PATH}" || ! -f "${BROWSER_PATH}" ]]; then
            echo "Failed to install browser (empty path or binary missing: '${BROWSER_PATH}')"
            exit 1
          fi
          echo "browser installed to: ${BROWSER_PATH}"
          echo "EMTEST_BROWSER=${BROWSER_PATH}" >> "$GITHUB_ENV"
        shell: bash

      - name: Browser tests (Firefox)
        run: .\test\runner.exe browser.test_sdl_image browser.test_dylink_many skip:browser.test_glbook skip:browser.test_sdl2_mixer_wav_dash_l

