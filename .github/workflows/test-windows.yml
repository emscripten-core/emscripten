name: test-windows

on:
  create:
    tags:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: 'path with spaces ()'
    env:
      PYTHONUNBUFFERED: "1"
      EMSDK_NOTTY: "1"
      EMTEST_LACKS_NATIVE_CLANG: "1"
      EMTEST_SKIP_V8: "1"
      EMTEST_SKIP_SCONS: "1"
      EMTEST_SKIP_RUST: "1"
      EMTEST_SKIP_NODE_25: "1"
      EMTEST_SKIP_PKG_CONFIG: "1"
      EMTEST_SKIP_MESON: "1"
      EMTEST_BROWSER: "0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2
        with:
          path: 'path with spaces ()'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build launcher
        run: |
          cd tools\pylauncher
          call build.bat
        shell: cmd

      - name: Install cmake and ninja
        run: |
          python -m pip install cmake ninja
          cmake --version
          ninja --version

      - name: Read emsdk version
        id: emsdk_version
        run: echo "version=$((Get-Content test/emsdk_version.txt).Trim())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install Emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk_version.outputs.version }}
          emsdk-version: main

      - name: Set EM_CONFIG
        run: echo "EM_CONFIG=$env:EMSDK\.emscripten" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Pip install
        run: '& $env:EMSDK_PYTHON -m pip install -r requirements-dev.txt'

      - name: Bootstrap
        run: '& $env:EMSDK_PYTHON bootstrap.py'

      - name: Crossplatform tests
        run: .\test\runner.exe --crossplatform-only

      - name: Sockets tests
        run: .\test\runner.exe 'sockets_node.test_nodejs_sockets_echo*'

      - name: Sanity tests
        run: .\test\runner.exe sanity.test_windows_path_casing

      - name: Check clean
        run: |
          git checkout tools/pylauncher
          & $env:EMSDK_PYTHON test/check_clean.py
