name: 'Prepare for Tests'
description: 'Prepares the environment for running Emscripten tests'
runs:
  using: "composite"
  steps:
    - name: Read emsdk version
      id: emsdk_version
      run: echo "version=$(cat test/emsdk_version.txt)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install Emsdk
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ steps.emsdk_version.outputs.version }}
        emsdk-version: main

    - name: Attach workspace
      uses: actions/download-artifact@v8
      with:
        name: emscripten-cache
        path: ~/

    - name: Extract persistent directories
      run: |
        tar -xzf ~/emscripten-cache.tar.gz -C ~/
        sed -i "s|\|.*|\|$EMSDK/upstream/bin|" ~/cache/sanity.txt
      shell: bash

    - name: Set EM_CONFIG
      run: echo "EM_CONFIG=$EMSDK/.emscripten" >> $GITHUB_ENV
      shell: bash

    - name: Setup cache config
      run: |
        echo "import os" >> $EMSDK/.emscripten
        echo "CACHE = '~/cache'" >> $EMSDK/.emscripten
        echo "V8_ENGINE = '~/.jsvu/bin/v8'" >> $EMSDK/.emscripten
        echo "JS_ENGINES = [NODE_JS]" >> $EMSDK/.emscripten
        echo "if os.path.exists(os.path.expanduser(V8_ENGINE)): JS_ENGINES.append(V8_ENGINE)" >> $EMSDK/.emscripten
        echo "WASM_ENGINES = []" >> $EMSDK/.emscripten
        test -f ~/vms/wasmtime && echo "WASMTIME = '~/vms/wasmtime'; WASM_ENGINES.append(WASMTIME)" >> $EMSDK/.emscripten || true
        test -f ~/vms/wasmer && echo "WASMER = '~/vms/wasmer'; WASM_ENGINES.append(WASMER)" >> $EMSDK/.emscripten || true
        test -d ~/wasi-sdk && cp -a ~/wasi-sdk/lib/ $($EMSDK/upstream/bin/clang -print-resource-dir) || true
      shell: bash

    - name: Pip install
      run: python -m pip install -r requirements-dev.txt
      shell: bash

    - name: Bootstrap
      run: ./bootstrap.py
      shell: bash
