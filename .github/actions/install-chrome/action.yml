name: 'Install Chrome'
description: 'Installs Google Chrome Canary'
runs:
  using: "composite"
  steps:
    - name: Download and install Chrome Canary
      run: |
        cd $HOME
        npx --yes @puppeteer/browsers install chrome@canary --format={{path}} | tee browser_path.txt
        BROWSER_PATH=$(cat browser_path.txt 2>/dev/null || true)
        # @puppeteer/browsers can exit 0 on truncated downloads while
        # failing to extract the binary or outputting an empty path.
        # See: https://github.com/puppeteer/puppeteer/issues/15487
        if [[ -z "${BROWSER_PATH}" || ! -x "${BROWSER_PATH}" ]]; then
          echo "Failed to install browser (empty path or binary missing)"
          exit 1
        fi
        echo "browser installed to: ${BROWSER_PATH}"
        "${BROWSER_PATH}" --version
        echo "EMTEST_BROWSER=${BROWSER_PATH}" >> $GITHUB_ENV
      shell: bash


